<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Gestão · Shisha Store</title>
  <link rel="icon" type="image/png" href="img/logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- LOGIN -->
  <section class="login" id="login" hidden>
    <form class="login__card" id="loginForm" autocomplete="off">
      <img src="img/logo-h.png" alt="Shisha Store" class="login__logo">
      <h1>Área de gestão</h1>
      <p class="muted">Introduz o PIN para gerir a loja.</p>
      <input type="password" inputmode="numeric" id="pin" placeholder="PIN" maxlength="8" autofocus>
      <p class="login__err" id="loginErr" hidden>PIN incorreto. Tenta outra vez.</p>
      <button class="btn btn--dark btn--block" type="submit">Entrar</button>
      <p class="login__hint">Demonstração · PIN: <b>1234</b></p>
      <a href="index.html" class="login__back">← Voltar à loja</a>
    </form>
  </section>

  <!-- APP -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <a href="#/painel" class="side__logo"><img src="img/logo-h-white.png" alt="Shisha Store"></a>
      <nav class="side__nav">
        <a href="#/painel" data-nav="painel"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Resumo</a>
        <a href="#/produtos" data-nav="produtos"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Produtos</a>
        <a href="#/encomendas" data-nav="encomendas"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Encomendas <span class="side__badge" id="newOrders" hidden>0</span></a>
        <a href="#/loja" data-nav="loja"><svg viewBox="0 0 24 24"><path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16M9 20v-6h6v6"/></svg>Dados da loja</a>
        <a href="#/dados" data-nav="dados"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v3h16v-3"/></svg>Cópias de segurança</a>
      </nav>
      <div class="side__foot">
        <a href="index.html" target="_blank" class="side__link"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v6H4V6h6"/></svg>Ver loja</a>
        <button class="side__link" id="logout"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Sair</button>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <button class="icon-btn top__burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div>
          <h1 id="pageTitle">Resumo</h1>
          <p class="muted" id="pageSub"></p>
        </div>
        <div class="top__right" id="topActions"></div>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <!-- EDITOR DE PRODUTO -->
  <div class="overlay" id="overlay"></div>
  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel__head"><strong id="panelTitle">Produto</strong><button class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="panel__body" id="panelBody"></div>
    <div class="panel__foot" id="panelFoot"></div>
  </aside>

  <div class="toast" id="toast"></div>

  <script>window.SS_ADMIN = true;</script>
  <script src="js/data.js"></script>
  <script src="js/store-data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
